name: End-to-end tests
on: push
jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Cypress Tests
        uses: cypress-io/github-action@v6
        with: 
            start: 'npm run dev'
            build: 'npm run build'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
            name: Cypress Results
            path: |
                cypress/screenshots
                cypress/videos
                cypress/results